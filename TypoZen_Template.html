<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypoZen Editor</title>
    <!-- First statement in the document: with this and the mark before the main script,
         a slow start can be attributed to the navigation itself vs parsing vs our own JS.
         That distinction is what found the DNS stall (see TypoZen_App.cs, CreateAsync). -->
    <script>window.__tzHead = Math.round(performance.now());</script>
    <!--
      Fonts ship with the app (fonts/), so nothing is fetched from the network — ever.

      This used to be a <link> to fonts.googleapis.com. A stylesheet link in <head> is
      render-blocking, so the editor could not paint until a round trip to Google finished
      or failed, on every cold start of a local desktop app. Google's CSS also declares
      @font-face without a local() source, so it shadowed fonts the user already had
      installed and downloaded them again.

      local() comes first below: an installed copy is used directly and the bundled file
      is never touched. The bundled file is the fallback for machines without the font.
    -->
    <style id="bundled-fonts">
        /* Inter — variable, weight 100..900 */
        @font-face {
            font-family: 'Inter';
            src: local('Inter'), url('fonts/Inter.ttf') format('truetype');
            font-weight: 100 900; font-style: normal; font-display: swap;
        }
        @font-face {
            font-family: 'Inter';
            src: local('Inter Italic'), url('fonts/Inter-Italic.ttf') format('truetype');
            font-weight: 100 900; font-style: italic; font-display: swap;
        }
        /* Source Sans 3 — variable, weight 200..900 */
        @font-face {
            font-family: 'Source Sans 3';
            src: local('Source Sans 3'), url('fonts/SourceSans3.ttf') format('truetype');
            font-weight: 200 900; font-style: normal; font-display: swap;
        }
        @font-face {
            font-family: 'Source Sans 3';
            src: local('Source Sans 3 Italic'), url('fonts/SourceSans3-Italic.ttf') format('truetype');
            font-weight: 200 900; font-style: italic; font-display: swap;
        }
        /* Merriweather — variable, weight 300..900 */
        @font-face {
            font-family: 'Merriweather';
            src: local('Merriweather'), url('fonts/Merriweather.ttf') format('truetype');
            font-weight: 300 900; font-style: normal; font-display: swap;
        }
        @font-face {
            font-family: 'Merriweather';
            src: local('Merriweather Italic'), url('fonts/Merriweather-Italic.ttf') format('truetype');
            font-weight: 300 900; font-style: italic; font-display: swap;
        }
        /* Literata — static faces */
        @font-face {
            font-family: 'Literata';
            src: local('Literata'), url('fonts/Literata.ttf') format('truetype');
            font-weight: 400; font-style: normal; font-display: swap;
        }
        @font-face {
            font-family: 'Literata';
            src: local('Literata Italic'), url('fonts/Literata-Italic.ttf') format('truetype');
            font-weight: 400; font-style: italic; font-display: swap;
        }
        @font-face {
            font-family: 'Literata';
            src: local('Literata Bold'), url('fonts/Literata-Bold.ttf') format('truetype');
            font-weight: 700; font-style: normal; font-display: swap;
        }
        @font-face {
            font-family: 'Literata';
            src: local('Literata Bold Italic'), url('fonts/Literata-BoldItalic.ttf') format('truetype');
            font-weight: 700; font-style: italic; font-display: swap;
        }
        /*
          Bookerly — static faces. Two themes ask for it ('Bookerly', 'Georgia', serif) and
          it silently rendered Georgia instead: an "install for me only" copy registers
          under HKCU, and the WebView2 renderer sandbox does not enumerate per-user fonts,
          so local('Bookerly') found nothing and there was no bundled fallback behind it.

          NOTE ON LICENSING: unlike the other four families this is NOT an open licence.
          Bookerly is Amazon's, drawn by Dalton Maag, and its copyright forbids
          redistribution without written permission. It is fine in a private build; it must
          not be shipped to anyone else. See the fonts note in README.md.
        */
        @font-face {
            font-family: 'Bookerly';
            src: local('Bookerly'), url('fonts/Bookerly.ttf') format('truetype');
            font-weight: 400; font-style: normal; font-display: swap;
        }
        @font-face {
            font-family: 'Bookerly';
            src: local('Bookerly Italic'), url('fonts/Bookerly-Italic.ttf') format('truetype');
            font-weight: 400; font-style: italic; font-display: swap;
        }
        @font-face {
            font-family: 'Bookerly';
            src: local('Bookerly Bold'), url('fonts/Bookerly-Bold.ttf') format('truetype');
            font-weight: 700; font-style: normal; font-display: swap;
        }
        @font-face {
            font-family: 'Bookerly';
            src: local('Bookerly Bold Italic'), url('fonts/Bookerly-BoldItalic.ttf') format('truetype');
            font-weight: 700; font-style: italic; font-display: swap;
        }
    </style>
    <style id="theme-styles">
        :root {
            --bg: #18181B;
            --surface: #27272A;
            --border: #3F3F46;
            --tx: #F4F4F5;
            --tx-muted: #A1A1AA;
            --accent: #3B82F6;
            --accent-bg: rgba(59, 130, 246, 0.15);
            --code-bg: #202024;
            --quote-bg: rgba(39, 39, 42, 0.5);
            --font: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            --fs: 16px;
        }
    </style>
    <link rel="stylesheet" href="css/typozen.css">
</head>
<body>

    <!-- Sidebar -->
    <div id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-tab active" data-tab="outline" onclick="switchTab('outline')">Outline</div>
            <div class="sidebar-tab" data-tab="search" onclick="switchTab('search')">Search</div>
        </div>
        <div class="sidebar-content">
            <div id="tab-outline" class="tab-pane active">
                <div id="outline-list">
                    <div class="outline-item" style="opacity:0.5;">No headings found...</div>
                </div>
            </div>
            <!-- The Search pane owns its own query box, deliberately separate from the
                 Ctrl+F find bar. Focus has to leave the text field for , . < > to mean
                 next/prev instead of being typed, so Alt+S focuses this input and Enter
                 (or 3s idle) hands focus to the results list below. -->
            <div id="tab-search" class="tab-pane">
                <div class="sidebar-search-row">
                    <!-- &#xE721; is Segoe MDL2 Assets "Search", the shell's own icon set -->
                    <span class="sidebar-search-icon" aria-hidden="true">&#xE721;</span>
                    <input id="sidebarSearchInput" type="text" placeholder="Search…"
                           autocomplete="off" spellcheck="false" aria-label="Search document"
                           aria-controls="search-results-list" />
                    <span id="sidebarSearchCount">0/0</span>
                </div>
                <div id="search-results-list" tabindex="0" role="listbox" aria-label="Search results">
                    <div class="search-item" style="opacity:0.5;">No results...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Editor Container -->
    <div id="main-container">
        <div id="editor-wrapper">
            <!-- Live Preview WYSIWYG Mode -->
            <div id="editor" contenteditable="true" spellcheck="true"></div>
            <!-- Raw Source Mode -->
            <textarea id="source-editor" spellcheck="false"></textarea>
        </div>
        <!-- Book-style page numbers, Reader + Pagination only. Driven from the page map,
             so they double as a visible check that the pagination is real. -->
        <div id="page-indicator" aria-hidden="true" style="display:none;"></div>
        <!-- Position in the whole book.
             The editor's own scrollbar spans only the range currently laid out -- about 28
             pages of a 1400-page novel -- so dragging it cannot reach either end. This
             addresses pages instead, which is the coordinate the paginated model is built
             on and the one that covers the document however little of it is mounted. -->
        <div id="page-scrubber" style="display:none;">
            <input id="page-scrubber-range" type="range" min="0" max="0" value="0" step="1"
                   aria-label="Position in document" />
            <div id="page-scrubber-bubble" aria-hidden="true"></div>
        </div>
    </div>

    <!-- Document Find & Replace (editor/source only) -->
    <div id="findBar" role="search" aria-label="Find and Replace" tabindex="-1">
        <div class="find-row">
            <label for="findInput">Find</label>
            <input id="findInput" type="text" placeholder="Find…" autocomplete="off" spellcheck="false" tabindex="0" />
            <span id="findCount">0/0</span>
            <button type="button" id="findPrev" title="Previous (Shift+Enter)">▲</button>
            <button type="button" id="findNext" title="Next (Enter)">▼</button>
            <button type="button" id="findClose" title="Close (Esc)">✕</button>
        </div>
        <div class="find-row">
            <label for="replaceInput">Replace</label>
            <input id="replaceInput" type="text" placeholder="Replace with…" autocomplete="off" spellcheck="false" />
            <button type="button" id="findReplaceOne" title="Replace current match">Replace</button>
            <button type="button" id="findReplaceAll" class="primary" title="Replace all matches">All</button>
        </div>
        <div class="find-opts">
            <label><input type="checkbox" id="findMatchCase" /> Match case</label>
            <label><input type="checkbox" id="findWholeWord" /> Whole word</label>
            <span id="findStatus" style="opacity:0.7;margin-left:auto;"></span>
        </div>
    </div>

    <!-- Notepad-style table size picker (hover grid) -->
    <div id="tableSizePicker" class="tz-table-picker" style="display:none;" role="dialog" aria-label="Insert table">
        <div class="tz-table-picker-inner">
            <div class="tz-table-picker-title" id="tableSizeLabel">Insert table</div>
            <div class="tz-table-picker-grid" id="tableSizeGrid"></div>
            <button type="button" class="tz-table-picker-custom" id="tableSizeCustom">Custom size…</button>
        </div>
    </div>

    <!-- Table Insert Modal (custom size) -->
    <div id="tableModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.65); z-index:99999; align-items:center; justify-content:center; backdrop-filter:blur(4px);" onkeydown="if(event.key==='Escape'){closeTableModal(); event.preventDefault();}">
        <div style="background:var(--bg, #1E293B); border:1px solid var(--border, #3F3F46); border-radius:10px; padding:22px; width:320px; box-shadow:0 20px 40px rgba(0,0,0,0.6); color:var(--tx, #F8FAFC); font-family:var(--font-sans, 'Inter', sans-serif);">
            <h3 style="margin:0 0 16px 0; font-size:16px; font-weight:600; color:var(--hi, #60A5FA);">Insert Markdown Table</h3>
            <div style="margin-bottom:14px;">
                <label style="display:block; font-size:12px; opacity:0.85; margin-bottom:5px; font-weight:500;">Columns</label>
                <input id="tblCols" type="number" min="1" max="20" value="3" style="width:100%; padding:8px 10px; border-radius:6px; border:1px solid var(--border, #3F3F46); background:var(--surface, rgba(255,255,255,0.05)); color:var(--tx, #F8FAFC); font-size:14px; box-sizing:border-box; outline:none;" onkeydown="if(event.key==='Enter'){confirmInsertTable(); event.preventDefault();}else if(event.key==='Escape'){closeTableModal(); event.preventDefault();}"/>
            </div>
            <div style="margin-bottom:22px;">
                <label style="display:block; font-size:12px; opacity:0.85; margin-bottom:5px; font-weight:500;">Data rows (header is added automatically)</label>
                <input id="tblRows" type="number" min="1" max="50" value="3" style="width:100%; padding:8px 10px; border-radius:6px; border:1px solid var(--border, #3F3F46); background:var(--surface, rgba(255,255,255,0.05)); color:var(--tx, #F8FAFC); font-size:14px; box-sizing:border-box; outline:none;" onkeydown="if(event.key==='Enter'){confirmInsertTable(); event.preventDefault();}else if(event.key==='Escape'){closeTableModal(); event.preventDefault();}"/>
            </div>
            <div style="display:flex; justify-content:flex-end; gap:10px;">
                <button onclick="closeTableModal()" style="padding:7px 14px; border-radius:6px; border:1px solid var(--border, #3F3F46); background:transparent; color:var(--tx, #F8FAFC); cursor:pointer; font-size:13px; font-weight:500;">Cancel</button>
                <button onclick="confirmInsertTable()" style="padding:7px 16px; border-radius:6px; border:none; background:var(--accent, #3B82F6); color:var(--accent-tx, #FFF); font-weight:600; cursor:pointer; font-size:13px; box-shadow:0 2px 6px rgba(59,130,246,0.35);">Insert Table</button>
            </div>
        </div>
    </div>

    <script>window.__tzBeforeMain = Math.round(performance.now());</script>
    <script src="js/typozen.js"></script>
</body>
</html>
