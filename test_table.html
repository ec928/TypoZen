<!DOCTYPE html>
<html>
<head>
<style>
  body { max-width: 800px; margin: 0 auto; font-family: sans-serif; }
  .table-wrapper {
      overflow-x: auto;
      margin: 8px 0;
      border: 1px solid #ccc;
  }
  .zen-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
  }
  .zen-table th, .zen-table td {
      padding: 6px 10px;
      border: 1px solid #ccc;
      overflow-wrap: break-word;
  }
</style>
</head>
<body>
  <div class="table-wrapper">
    <table class="zen-table">
      <thead>
        <tr>
          <th>Type</th><th>Files</th><th>Theme</th><th>Line</th><th>Paragraph</th><th>Margins</th><th>Justified</th><th>Font Size</th><th>Word Wrap</th><th>Columns</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Code</td>
          <td>HTML, XML, XAML, CSS, JSON, JS/TS, C#, etc. plus .log and .csv</td>
          <td>Tokyo Night</td>
          <td>Tight</td>
          <td>Tight</td>
          <td>Narrow</td>
          <td>off</td>
          <td>Normal</td>
          <td>off</td>
          <td>n/a</td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
