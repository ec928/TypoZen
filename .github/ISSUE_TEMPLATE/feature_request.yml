name: Feature request
description: Suggest an improvement or a new capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you're trying to write or read and why it's awkward today, rather than the feature you have in mind.
      placeholder: When drafting long documents I lose my place after every preview refresh.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?

  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried instead?
      description: Workarounds, or other editors that handle this well.
